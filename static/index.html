<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>video-service test</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 2rem; max-width: 60rem; }
  h1 { font-size: 1.2rem; margin: 0 0 1rem; }
  fieldset { border: 1px solid #8884; border-radius: 6px; margin: 0 0 1rem; padding: 1rem; }
  legend { padding: 0 .4rem; font-weight: 600; }
  label { display: block; margin: .4rem 0; }
  input, select, button { font: inherit; padding: .3rem .5rem; }
  button { cursor: pointer; }
  pre { background: #8881; padding: .75rem; border-radius: 6px; overflow-x: auto; }
  video { width: 100%; max-height: 24rem; background: #000; border-radius: 6px; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .pill { display: inline-block; padding: .1rem .5rem; border-radius: 999px; background: #8882; font-size: .85em; }
</style>
</head>
<body>
<h1>video-service test page</h1>

<fieldset>
  <legend>Upload</legend>
  <form id="upload">
    <label>Category <input name="category" value="default"></label>
    <label>File <input type="file" name="video" accept="video/*" required></label>
    <label>renditions <input name="renditions" placeholder="(blank = config default)"></label>
    <label>defer <input name="defer" placeholder="e.g. hd"></label>
    <button type="submit">Upload</button>
  </form>
</fieldset>

<fieldset>
  <legend>Playback</legend>
  <div class="row">
    <input id="vid" placeholder="video id" size="40">
    <input id="rend" placeholder="rendition" value="hd" size="12">
    <button id="play">Resolve &amp; play</button>
    <button id="poll">Poll status</button>
    <span id="state" class="pill"></span>
  </div>
  <p><video id="player" controls playsinline></video></p>
</fieldset>

<pre id="out">Ready.</pre>

<script>
const out = document.getElementById('out');
const show = (x) => out.textContent = typeof x === 'string' ? x : JSON.stringify(x, null, 2);

document.getElementById('upload').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const category = f.get('category') || 'default';
  const qs = new URLSearchParams();
  if (f.get('renditions')) qs.set('renditions', f.get('renditions'));
  if (f.get('defer')) qs.set('defer', f.get('defer'));
  const body = new FormData();
  body.append('video', f.get('video'));
  show('Uploading…');
  const res = await fetch(`/api/video/${encodeURIComponent(category)}?${qs}`, { method: 'POST', body });
  const json = await res.json().catch(() => ({}));
  show(json);
  if (json.id) document.getElementById('vid').value = json.id;
});

// The point of the test page: a 202 is a normal, expected answer, not an error.
// The client shows a spinner and asks again rather than handing a dead URL to the
// player.
async function resolve() {
  const id = document.getElementById('vid').value.trim();
  const rendition = document.getElementById('rend').value.trim() || 'hd';
  if (!id) return show('Enter a video id.');
  const res = await fetch(`/api/video/s/${id}/${rendition}`);
  const json = await res.json().catch(() => ({}));
  document.getElementById('state').textContent = res.status === 202 ? 'pending' : `ready (${json.rendition || '?'})`;
  show(json);
  if (res.status === 200 && json.url) {
    if (json.cookiePath) await fetch(json.cookiePath, { credentials: 'include' });
    document.getElementById('player').src = json.url;
  }
}

document.getElementById('play').addEventListener('click', resolve);
document.getElementById('poll').addEventListener('click', async () => {
  const id = document.getElementById('vid').value.trim();
  if (!id) return show('Enter a video id.');
  const res = await fetch(`/api/video/${id}/status`);
  const json = await res.json().catch(() => ({}));
  document.getElementById('state').textContent = json.state || res.status;
  show(json);
});
</script>
</body>
</html>
