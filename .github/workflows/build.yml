name: Build and push to GHCR

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'

jobs:
  build:
    runs-on: ${{ fromJSON(vars.RUNNER_MAP || '{}')[matrix.runner] || (contains(matrix.runner, 'arm64') && 'ubuntu-24.04-arm' || 'ubuntu-latest') }}
    timeout-minutes: 40
    strategy:
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: linux-x64-build
          - platform: arm64
            runner: linux-arm64-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # The layer cache follows the runner (see hikari-systems/hs-ci-actions).
      - name: Build and push by digest
        uses: hikari-systems/hs-ci-actions/docker-build@v1
        with:
          image: ghcr.io/hikari-systems/${{ github.event.repository.name }}
          platform: ${{ matrix.platform }}
          cache: ${{ fromJSON(vars.RUNNER_MAP || '{}')['_cache'][matrix.runner] || 'auto' }}
          registry-token: ${{ secrets.GH_TOKEN }}
          s3-bucket: hikari-docker-registry
          s3-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          registry-http-secret: ${{ secrets.DOCKER_REGISTRY_SECRET }}

  merge-manifest:
    runs-on: ${{ fromJSON(vars.RUNNER_MAP || '{}')['linux-any-light'] || 'ubuntu-latest' }}
    timeout-minutes: 10
    needs: build
    steps:
      - name: Merge the platform digests and tag the image
        uses: hikari-systems/hs-ci-actions/merge-manifest@v1
        with:
          image: ghcr.io/hikari-systems/${{ github.event.repository.name }}
          registry-token: ${{ secrets.GH_TOKEN }}
          s3-bucket: hikari-docker-registry
          s3-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          registry-http-secret: ${{ secrets.DOCKER_REGISTRY_SECRET }}
